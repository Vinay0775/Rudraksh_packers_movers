<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Driver Partner Portal | Rudraksha Logistics</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

  <!-- Driver CSS -->
  <link rel="stylesheet" href="driver.css">
</head>
<body class="driver-body">

  <!-- Top Navbar -->
  <header class="driver-navbar d-flex justify-content-between align-items-center">
    <div class="d-flex align-items-center gap-2">
      <img src="favicon.png" alt="Rudraksha" style="width: 32px; height: 32px; border-radius: 8px;">
      <div>
        <h6 class="fw-bold mb-0 text-white" style="font-size: 0.95rem;">Rudraksha Rider</h6>
        <span class="small text-muted" style="font-size: 0.72rem;" id="driverVehInfo">Tata Ace • RJ-14-GA-1024</span>
      </div>
    </div>

    <div class="driver-duty-toggle">
      <span class="spinner-grow spinner-grow-sm text-success" role="status"></span>
      <span>ON DUTY</span>
    </div>
  </header>

  <!-- Main Container -->
  <main class="container py-3" style="max-width: 600px;">
    
    <!-- Driver Stats Ribbon -->
    <div class="row g-2 mb-3">
      <div class="col-4">
        <div class="p-2 rounded-3 text-center" style="background: #17171B; border: 1px solid rgba(255,255,255,0.06);">
          <div class="small text-muted" style="font-size: 0.7rem;">Today's Earnings</div>
          <strong class="text-success fs-6" id="driverEarnings">₹1,240</strong>
        </div>
      </div>
      <div class="col-4">
        <div class="p-2 rounded-3 text-center" style="background: #17171B; border: 1px solid rgba(255,255,255,0.06);">
          <div class="small text-muted" style="font-size: 0.7rem;">Trips Done</div>
          <strong class="text-white fs-6" id="driverTripCount">6</strong>
        </div>
      </div>
      <div class="col-4">
        <div class="p-2 rounded-3 text-center" style="background: #17171B; border: 1px solid rgba(255,255,255,0.06);">
          <div class="small text-muted" style="font-size: 0.7rem;">Rider Rating</div>
          <strong class="text-warning fs-6">★ 4.9</strong>
        </div>
      </div>
    </div>

    <!-- Active Delivery Trip (If Any) -->
    <div id="activeTripContainer">
      <!-- Injected by driver.js when trip is active -->
    </div>

    <!-- Incoming Delivery Feed -->
    <div class="d-flex justify-content-between align-items-center mb-2 px-1">
      <h6 class="fw-bold text-white mb-0"><i class="fa-solid fa-bell text-warning me-1"></i> Available Parcel Requests</h6>
      <button class="btn btn-sm text-muted" onclick="loadDriverFeed()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    </div>

    <div id="driverFeedList">
      <!-- Injected by driver.js -->
      <div class="text-center py-4 text-muted small">
        <i class="fa-solid fa-spinner fa-spin fa-2x mb-2"></i><br>
        Scanning for nearby parcel delivery jobs...
      </div>
    </div>

  </main>

  <!-- Verify OTP Modal -->
  <div class="modal fade" id="otpModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content text-white" style="background: #17171B; border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;">
        <div class="modal-body p-4 text-center">
          <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(208, 253, 56, 0.15); border: 2px solid #D0FD38; display: inline-flex; align-items: center; justify-content: center; color: #D0FD38; font-size: 1.6rem;" class="mb-3">
            <i class="fa-solid fa-shield-keyhole"></i>
          </div>
          <h5 class="fw-bold mb-1" id="otpModalTitle">Enter 4-Digit Pickup OTP</h5>
          <p class="text-muted small mb-3" id="otpModalSub">Ask the sender for the 4-digit secret OTP to confirm goods handover.</p>

          <input type="tel" class="otp-input-field mb-3" id="inputDriverOtp" placeholder="••••" maxlength="4">

          <div class="d-flex gap-2">
            <button type="button" class="btn btn-outline-secondary flex-fill rounded-pill" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-driver-accept flex-fill rounded-pill" id="btnConfirmDriverOtp" onclick="submitOtpVerification()">Verify & Start Trip</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Driver Logic JS -->
  <script src="driver.js"></script>
</body>
</html>
